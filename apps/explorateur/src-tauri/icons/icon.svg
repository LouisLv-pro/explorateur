<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262626"/>
      <stop offset="1" stop-color="#171717"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Gabarit macOS : forme de 824 px, marge de 100 px (même fond que memo, taches, diagrammes) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <!-- Branches de l'arborescence : un dossier, deux fichiers -->
  <path d="M362 440 V710 M362 555 H450 M362 710 H450" fill="none" stroke="#a1a1a1" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#shadow)">
    <!-- Dossier : onglet puis corps -->
    <path d="M300 300 Q300 268 332 268 H402 Q420 268 432 282 L452 304 H560 Q592 304 592 336 V408 Q592 440 560 440 H332 Q300 440 300 408 Z" fill="#ffffff"/>
    <!-- Fichier -->
    <rect x="450" y="515" width="274" height="80" rx="26" fill="#ffffff"/>
    <!-- Fichier courant : seule touche de couleur -->
    <rect x="450" y="670" width="274" height="80" rx="26" fill="#0070f3"/>
  </g>
  <!-- Lignes de texte des fichiers -->
  <rect x="486" y="543" width="150" height="24" rx="12" fill="#171717"/>
  <rect x="486" y="698" width="190" height="24" rx="12" fill="#ffffff"/>
</svg>
