[package]
name = "explorateur"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
# Suffixe `_lib` : évite un conflit de nom avec le binaire (voir rust-lang/cargo#8519).
name = "explorateur_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
explorateur-core = { path = "../core" }
# protocol-asset : affiche images, PDF et pages HTML locales (décision 0001).
# unstable : API multi-webview (`Window::add_child`) du navigateur intégré (décision 0011).
tauri = { workspace = true, features = ["protocol-asset", "unstable"] }
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
percent-encoding.workspace = true
serde.workspace = true
specta.workspace = true
tauri-specta.workspace = true
specta-typescript.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Canal entre le gestionnaire de fin d'AppKit et la commande asynchrone (app par défaut).
tokio = { workspace = true, features = ["sync"] }

# App par défaut d'un type (spec `app-par-defaut.md`) : NSWorkspace, NSBundle et UTType.
[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
block2.workspace = true
objc2-foundation.workspace = true
objc2-app-kit.workspace = true
objc2-uniform-type-identifiers.workspace = true

[lints]
workspace = true
