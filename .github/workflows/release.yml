# Release macOS signée et notarisée d'explorateur.
# Copié dans .github/workflows/release.yml du dépôt public par scripts/publier.sh.
#
# - Tag `vX.Y.Z` poussé : construit, signe, notarise, puis crée une release en brouillon.
# - Lancement manuel (workflow_dispatch) : même chose sans release, artefacts seulement (essai à blanc).
#
# Secrets à créer dans le dépôt (Settings > Secrets and variables > Actions) :
#   APPLE_CERTIFICATE            certificat « Developer ID Application » exporté en .p12, encodé base64
#   APPLE_CERTIFICATE_PASSWORD   mot de passe choisi à l'export du .p12
#   APPLE_SIGNING_IDENTITY       « Developer ID Application: Nom (TEAMID) »
#   APPLE_API_ISSUER             Issuer ID de la clé App Store Connect
#   APPLE_API_KEY                Key ID de la clé App Store Connect
#   APPLE_API_KEY_P8             contenu du fichier AuthKey_<Key ID>.p8
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      APP: "explorateur"
    steps:
      - uses: actions/checkout@v4

      - name: Version du tag = version de l'app
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(jq -r .version "apps/$APP/src-tauri/tauri.conf.json")"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME, mais tauri.conf.json dit $version" >&2; exit 1; }

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      # La version de Rust vient de rust-toolchain.toml ; les deux cibles servent au binaire universel.
      - name: Rust
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      - name: Importer le certificat dans un trousseau temporaire
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/build.keychain-db"
          password="$(uuidgen)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"

      - name: Clé de notarisation
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          echo "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      # Tauri signe le .app (runtime durci), le notarise et agrafe le ticket, puis fabrique le .dmg.
      - name: Construire, signer et notariser le .app
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: pnpm --filter "$APP" tauri build --target universal-apple-darwin --bundles app,dmg

      # Le .dmg est un conteneur à part : on le signe et on le notarise aussi.
      - name: Signer et notariser le .dmg
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          version="$(jq -r .version "apps/$APP/src-tauri/tauri.conf.json")"
          bundle="target/universal-apple-darwin/release/bundle"
          mkdir -p dist-release
          out="dist-release/$APP-$version-macos-universal.dmg"
          cp "$bundle"/dmg/*.dmg "$out"
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp "$out"
          xcrun notarytool submit "$out" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$out"
          (cd dist-release && shasum -a 256 "$(basename "$out")" > "$(basename "$out").sha256")

      - name: Vérifier ce que Gatekeeper verra
        run: |
          bundle="target/universal-apple-darwin/release/bundle"
          app="$(find "$bundle/macos" -maxdepth 1 -name '*.app' | head -1)"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=4 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type open --context context:primary-signature --verbose=4 dist-release/*.dmg
          xcrun stapler validate dist-release/*.dmg
          lipo -archs "$app"/Contents/MacOS/*
          { echo '### Empreinte pour le cask Homebrew'; echo '```'; cat dist-release/*.sha256; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist-release/*

      - name: Release en brouillon
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist-release/* --draft --generate-notes --title "$GITHUB_REF_NAME"

      - name: Nettoyer le trousseau
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"
